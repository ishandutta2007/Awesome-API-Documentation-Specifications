<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.06); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5; opacity: 0.8; }
      50% { r: 8; opacity: 1; }
    }

    .pulse-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .flow-path {
      stroke-dasharray: 12, 12;
      animation: flowLine 15s linear infinite;
    }
    .pill-float-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPill2 6s ease-in-out infinite;
    }
    .node-pulse {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Glow Orbs in Background (Will never obscure foreground text) -->
  <circle cx="200" cy="180" r="180" fill="#6366f1" class="pulse-glow" filter="url(#glow)" />
  <circle cx="1000" cy="180" r="160" fill="#ec4899" class="pulse-glow" filter="url(#glow)" style="animation-delay: -3s;" />

  <!-- Animated Spec Data Flow Lines (Background Layer) -->
  <path d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="url(#accentGradient)" stroke-width="2" class="flow-path" opacity="0.3" />
  <path d="M 50 290 Q 300 340 600 290 T 1150 290" fill="none" stroke="url(#accentGradient)" stroke-width="2" class="flow-path" opacity="0.3" style="animation-direction: reverse;" />

  <!-- Dynamic Interactive Floating Pill 1: Left Background (OpenAPI 3.1) -->
  <g class="pill-float-1" transform="translate(60, 140)">
    <rect width="170" height="42" rx="21" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#10b981" class="node-pulse" />
    <text x="42" y="26" fill="#e2e8f0" font-size="13" font-family="sans-serif" font-weight="600">OpenAPI 3.1 / OAS</text>
  </g>

  <!-- Dynamic Interactive Floating Pill 2: Left Bottom Background (AsyncAPI & Workflows) -->
  <g class="pill-float-2" transform="translate(100, 210)">
    <rect width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#38bdf8" class="node-pulse" style="animation-delay: -1s;" />
    <text x="42" y="26" fill="#e2e8f0" font-size="13" font-family="sans-serif" font-weight="600">AsyncAPI &amp; Arazzo</text>
  </g>

  <!-- Dynamic Interactive Floating Pill 3: Right Top Background (Interactive Docs & SDKs) -->
  <g class="pill-float-2" transform="translate(940, 120)">
    <rect width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#f43f5e" class="node-pulse" style="animation-delay: -1.5s;" />
    <text x="42" y="26" fill="#e2e8f0" font-size="13" font-family="sans-serif" font-weight="600">Interactive Portals</text>
  </g>

  <!-- Dynamic Interactive Floating Pill 4: Right Bottom Background (Spec Governance & Linting) -->
  <g class="pill-float-1" transform="translate(970, 190)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#a855f7" class="node-pulse" style="animation-delay: -2s;" />
    <text x="42" y="26" fill="#e2e8f0" font-size="13" font-family="sans-serif" font-weight="600">Spectral Governance</text>
  </g>

  <!-- Central Foreground Shield / Content Area (Protected, high-contrast, crystal clear typography) -->
  <g id="foreground-content">
    <!-- Category Badge -->
    <g transform="translate(460, 48)">
      <rect width="280" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="140" y="20" fill="#a5b4fc" font-size="12" font-family="sans-serif" font-weight="700" letter-spacing="1" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" class="title-text" font-size="44" fill="#ffffff">
      Awesome API Documentation
    </text>
    <text x="600" y="195" text-anchor="middle" class="title-text" font-size="38" fill="url(#accentGradient)">
      &amp; Specifications
    </text>

    <!-- Subtitle -->
    <text x="600" y="245" text-anchor="middle" class="sub-text" font-size="16" fill="#94a3b8" letter-spacing="0.2">
      The definitive index of OpenAPI renderers, interactive portals, spec linters, and SDK generators
    </text>

    <!-- Spec Badges Group -->
    <g transform="translate(365, 275)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="52" y="17" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">⚡ OpenAPI 3.1</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(120, 0)">
        <rect width="115" height="26" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="57" y="17" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">📖 Swagger / Redoc</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(250, 0)">
        <rect width="105" height="26" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="52" y="17" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">🎯 SDK Gen</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(370, 0)">
        <rect width="100" height="26" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="50" y="17" fill="#cbd5e1" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">🛡️ Governance</text>
      </g>
    </g>
  </g>
</svg>
